<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b6e66" />
    <meta
      name="description"
      content="EffiQuest 3D - an interactive machine and efficiency laboratory for Grade 11 General Science."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>EffiQuest 3D</title>
    <script>
      // Apply the saved theme before the first paint (no flash of the other theme).
      try {
        var t = JSON.parse(localStorage.getItem('effiquest-ui') || '{}').state;
        if (t && (t.theme === 'light' || t.theme === 'dark')) {
          document.documentElement.dataset.theme = t.theme;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
