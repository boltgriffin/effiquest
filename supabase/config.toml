# Supabase CLI settings for LOCAL development only (`supabase start`). Hosted projects are
# configured in the dashboard to the same values (docs/BACKEND_AND_SECURITY.md section 6).
project_id = "effiquest"

[api]
# Only the public schema is exposed; RLS protects every table in it.
schemas = ["public"]
max_rows = 1000

[db]
major_version = 17

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:4173"]
# Decision D-20: no anonymous accounts and no self sign-up. Teacher accounts are created by the
# administrator; learner accounts (code + PIN, no email) by the manage-learners Edge Function.
enable_anonymous_sign_ins = false
enable_signup = false
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_confirmations = false
secure_password_change = true

[auth.rate_limit]
# Sign-in attempts per 5 minutes per IP. A whole class signs in from one school network, so keep
# headroom; PIN guessing is still slowed (8 characters from 31 symbols).
sign_in_sign_ups = 120

[functions.manage-learners]
# Supabase rejects calls without a valid user JWT before the function runs.
verify_jwt = true
